name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the Sanity publish webhook (README, "Content deploys").
  workflow_dispatch:

# One run per branch or PR. Pushes and publishes queue so deploys land in
# order, and a burst of publishes collapses into one pending run. A new push
# to a PR cancels its older run so the preview never goes stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  # A Sanity publish changes content only. When this exact commit already
  # passed every gate on main, the code-only gates are skipped.
  verify:
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - id: check
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json event,headBranch \
            --jq 'map(select(.headBranch == "main" and (.event == "push" or .event == "workflow_dispatch"))) | length')
          echo "verified=$([ "$passed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Fast checks and the one build every later job tests and deploys. On a
  # verified publish only the content steps run, so a new npm advisory or lint
  # rule cannot block a content deploy.
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        if: needs.verify.outputs.verified != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=high
        if: needs.verify.outputs.verified != 'true'
      - run: npm run lint
        if: needs.verify.outputs.verified != 'true'
      - run: npm run check
        if: needs.verify.outputs.verified != 'true'
      - run: npm run check:tokens
        if: needs.verify.outputs.verified != 'true'
      # Where the tools post leads: the production tools host. Its LEAD_MAGNET_ALLOWED_ORIGINS must list this site's origin.
      - run: npm run build
        env:
          PUBLIC_TOOLS_API: https://tools.wusoolcapital.com
      - run: npm run check:dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    needs: [verify, build]
    if: needs.verify.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The system packages come from Ubuntu's mirrors, which the runner
      # sometimes cannot reach. The runner image already has Chromium's
      # libraries, so fall back to installing the browser alone.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:e2e

  # Lighthouse is the slowest gate, so its URLs are split across four runners.
  lhci:
    needs: [verify, build]
    if: needs.verify.outputs.verified != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # npx keeps the @lhci/cli download here; its version is pinned in package.json.
      - uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: lhci-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm run lhci
        env:
          LHCI_SHARD: ${{ matrix.shard }}/4

  # Sanity Studio and the migration scripts (separate package).
  studio:
    needs: verify
    if: needs.verify.outputs.verified != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v5
      # sanity schema validate also reads the root tsconfig, which extends astro's.
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc -p .
      - run: npx sanity schema validate

  # Preview version per pull request. Forks get no secrets, so they skip it.
  preview:
    needs: [build, e2e, lhci, studio]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Upload preview version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          npx wrangler versions upload --preview-alias "pr-$PR" --message "PR #$PR" | tee upload.log
          url=$(grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' upload.log | head -1)
          test -n "$url"
          echo "URL=$url" >> "$GITHUB_ENV"
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL (commit ${SHA::7})"

  # Deploys the existing Worker on main after every gate that ran passed.
  deploy:
    needs: [verify, build, e2e, lhci, studio]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx wrangler deploy --message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # A failed Sanity publish leaves the edit off the live site with no other
  # signal, so tell the team in Slack.
  notify-failure:
    needs: [verify, build, e2e, lhci, studio, deploy]
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: C0CH5M2C8BE
            text: "Website deploy failed after a Sanity publish. The change is not live yet. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
